<!DOCTYPE html>
<html
  lang="en"
>
<head>
  <meta
    charset="UTF-8"
  >
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>CanCare Connect — Admin: Users &amp; Audit Log</title>
  <link
    rel="stylesheet"
    href="css/style.css"
  >
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  >
</head>
<body>
  <div
    class="navbar"
    id="navbar"
  ></div>
  <div class="container">
    <h1>Users &amp; audit log</h1>
    <div class="tabs">
      <a
        class="tab"
        href="admin-verify.html"
      >Verification Queue</a>
      <a
        class="tab"
        href="admin-data.html"
      >Cost &amp; Aid Data</a>
      <a
        class="tab active"
        href="admin-users.html"
      >Users &amp; Audit Log</a>
    </div>

    <div class="tabs tabs-sub">
      <div
        class="tab active"
        id="tabUsers"
      >Users</div>
      <div
        class="tab"
        id="tabAudit"
      >Audit Log</div>
    </div>

    <div id="usersPanel">
      <h3>Users</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>City</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </div>

    <div
      id="auditPanel"
      class="hidden"
    >
      <h3>Audit log</h3>
      <div class="field">
        <label>Filter by action or target</label>
        <input
          id="auditFilter"
          placeholder="e.g. Suspended, Approved, a user's name"
        >
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Admin name</th><th>Action</th><th>Target</th><th>Timestamp</th></tr></thead>
          <tbody id="auditRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/admin-users.js"></script>
</body>
</html>
